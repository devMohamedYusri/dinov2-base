services:
  - type: web
    name: dino-furniture-search
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: COLLECTION_NAME
        value: furniture_catalog_small
      - key: ONNX_MODEL_PATH
        value: dinov2_small_quant.onnx
      - key: PYTHON_VERSION
        value: 3.11.9
